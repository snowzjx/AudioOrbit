name: AudioOrbit CI and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: |
          TEST_INFO_PLIST="$RUNNER_TEMP/AudioOrbit-TestHost-Info.plist"
          cp Config/Info.plist "$TEST_INFO_PLIST"
          plutil -replace LSMultipleInstancesProhibited -bool NO "$TEST_INFO_PLIST"
          xcodebuild \
            -project AudioOrbit.xcodeproj \
            -scheme AudioOrbit \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AudioOrbitDerivedData" \
            INFOPLIST_FILE="$TEST_INFO_PLIST" \
            test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/audioorbit-signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "" \
            "$KEYCHAIN_PATH"

      - name: Archive signed application
        env:
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild archive \
            -project AudioOrbit.xcodeproj \
            -scheme AudioOrbit \
            -configuration Release \
            -archivePath build/AudioOrbit.xcarchive \
            DEVELOPMENT_TEAM="$MACOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            MARKETING_VERSION="$VERSION" \
            clean archive

      - name: Sign embedded code and verify
        run: |
          APP_PATH="build/AudioOrbit.xcarchive/Products/Applications/AudioOrbit.app"
          SPARKLE="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          # Sparkle's nested binaries arrive with non-notarizable
          # signatures; re-sign every nested bundle with the Developer ID
          # identity and a secure timestamp before packaging.
          codesign --force --options runtime --timestamp --sign "Developer ID Application" \
            "$SPARKLE/Versions/B/XPCServices/Installer.xpc"
          codesign --force --options runtime --timestamp --sign "Developer ID Application" \
            "$SPARKLE/Versions/B/XPCServices/Downloader.xpc"
          codesign --force --options runtime --timestamp --sign "Developer ID Application" \
            "$SPARKLE/Versions/B/Updater.app"
          codesign --force --options runtime --timestamp --sign "Developer ID Application" \
            "$SPARKLE/Versions/B/Autoupdate"
          codesign --force --options runtime --timestamp --sign "Developer ID Application" \
            "$SPARKLE"
          codesign --force --options runtime --timestamp --sign "Developer ID Application" \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dvv "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" build/AudioOrbit-notarize.zip

      - name: Notarize and staple
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          echo "$APPSTORE_API_KEY_P8" | base64 --decode > "$AUTH_KEY_PATH"
          chmod 600 "$AUTH_KEY_PATH"
          xcrun notarytool submit build/AudioOrbit-notarize.zip \
            --key "$AUTH_KEY_PATH" \
            --key-id "$APPSTORE_API_KEY_ID" \
            --issuer "$APPSTORE_API_ISSUER_ID" \
            --wait \
            --output-format json > build/notary-result.json
          cat build/notary-result.json
          SUBMISSION_ID="$(jq -r '.id' build/notary-result.json)"
          STATUS="$(jq -r '.status' build/notary-result.json)"
          if [[ "$STATUS" != "Accepted" ]]; then
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$AUTH_KEY_PATH" \
              --key-id "$APPSTORE_API_KEY_ID" \
              --issuer "$APPSTORE_API_ISSUER_ID" || true
            exit 1
          fi
          APP_PATH="build/AudioOrbit.xcarchive/Products/Applications/AudioOrbit.app"
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Package notarized release
        run: |
          APP_PATH="build/AudioOrbit.xcarchive/Products/Applications/AudioOrbit.app"
          ditto -c -k --keepParent "$APP_PATH" build/AudioOrbit.zip
          shasum -a 256 build/AudioOrbit.zip > build/AudioOrbit.zip.sha256

      - name: Generate Sparkle appcast
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL "https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz" \
            -o "$RUNNER_TEMP/sparkle.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          # The secret holds the base64 EdDSA key string exported from the
          # macOS keychain: security find-generic-password -a ed25519 -w
          KEY_FILE="$RUNNER_TEMP/sparkle-eddsa-key"
          # Strip accidental whitespace or surrounding quotes; the key must be
          # exactly 44 base64 characters. Length diagnostics keep future
          # misformatted secrets debuggable without printing key material.
          # (\047 is an octal escape for the single quote; BSD tr on the
          # macOS runner does not understand the \x27 hex form and would
          # silently delete 'x', '2' and '7' from the key.)
          printf '%s' "$SPARKLE_EDDSA_KEY" | tr -d '[:space:]"\047' > "$KEY_FILE"
          echo "Sparkle EdDSA key length: $(wc -c < "$KEY_FILE") bytes (expected 44)"
          run_appcast() {
            "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
              --ed-key-file "$KEY_FILE" \
              --download-url-prefix "https://github.com/snowzjx/AudioOrbit/releases/download/$GITHUB_REF_NAME" \
              -o "$RUNNER_TEMP/appcast.xml" \
              build/AudioOrbit.zip
          }
          if ! run_appcast; then
            # Tolerate a secret that was accidentally base64-wrapped: decode
            # it once and retry.
            base64 -d "$KEY_FILE" > "$KEY_FILE.decoded" 2>/dev/null || true
            if [ -s "$KEY_FILE.decoded" ]; then
              mv "$KEY_FILE.decoded" "$KEY_FILE"
              run_appcast
            fi
          fi
          gh release create appcast \
            --title "AudioOrbit appcast" \
            --notes "Sparkle appcast feed for AudioOrbit updates." >/dev/null 2>&1 || true
          gh release upload appcast "$RUNNER_TEMP/appcast.xml" --clobber

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/AudioOrbit.zip \
            build/AudioOrbit.zip.sha256 \
            --verify-tag \
            --generate-notes \
            --title "AudioOrbit $GITHUB_REF_NAME"
